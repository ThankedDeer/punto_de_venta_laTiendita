<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>La Tiendita</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/index.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <script src="js/index.js"></script>

  </head>
  
  <body>
    <br><br><br><br>
    <div class="register-form"><br>
      <h2 style="text-align: center;">Inicio de Sesión</h2><br>
          <input type="text" id="Nom_Vendedor" placeholder="Usuario" required>
          <input type="password"  id="Contraseña" placeholder="Contraseña" required><br><br>
          <button class="btn-login" onclick="login()">Iniciar sesión</button>
  </div><br>

  
  <a href="./pages/menuPrincipal.html" target="_blank">Segunda Pagina</a> 

    <!-- Your app content here -->
    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script src="node_modules/popper.js/dist/umd/popper.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>

  </body >
  <script>
    function Login() {
      var nomVendedor = document.getElementById("Nom_Vendedor").value;
      var contraseña = document.getElementById("Contraseña").value;
    
      if (!nomVendedor || !contraseña) {
        console.log("Por favor, ingrese su nombre de usuario y contraseña.");
        return;
      }
    
      var credenciales = {
        Nom_Vendedor: nomVendedor,
        Contraseña: contraseña
      };
    
      axios.post('https://backtiendita-production-9419.up.railway.app/api/login', credenciales)
        .then((response) => {
          console.log(response.data.token);
          sessionStorage.setItem("tToken", response.data.token);
          window.location.href = "./pages/menuPrincipal.html";
        })
        .catch((error) => {
          console.log(error);
        });
    }
  </script>
</html>
