<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>La Tiendita</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/index.css" />

  </head>
  
  <body>
    <br><br><br><br>
    <div class="register-form"><br>
      <h2 style="text-align: center;">Inicio de Sesión</h2><br>
          <input type="text" id="Nom_Vendedor" placeholder="Usuario" required>
          <input type="password"  id="Contraseña" placeholder="Contraseña" required><br><br>
          <input type="submit" class="btn-login" id="btn-login" value="Iniciar Sesión" onclick="Login()">
  </div><br>

  
  <a href="./pages/menuPrincipal.html" target="_blank">Segunda Pagina</a>

    <!-- Your app content here -->
    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script src="node_modules/popper.js/dist/umd/popper.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>

  </body >
  <script>
    function Login(){
      let nomVendedor = document.getElementById("Nom_Vendedor").value;
      let contraseña = document.getElementById("Contraseña").value;
    
      // Validación de campos vacíos
      if (nomVendedor.trim() == '' || contraseña.trim() == '') {
        console.log('Por favor ingrese usuario y contraseña');
        return;
      }
    
      let credenciales = {
        Nom_Vendedor: nomVendedor,
        Contraseña: contraseña
      };
    
      axios.post("http://backtiendita-production-9419.up.railway.app/api/usuarios", credenciales)
        .then((response) => {
          console.log(response.data.token);
          sessionStorage.setItem("tToken", response.data.token);
          console.log("exitoso");
        })
        .catch((error) => {
          console.log("error");
        });
    }
  </script>
</html>
