<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punto de Venta</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/inventario.css" />
    <script src="../node_modules/axios/dist/axios.min.js"></script>
    <script src="../node_modules/sweetalert2/dist/sweetalert2.min.js"></script>
    <link rel="stylesheet" href="../node_modules/sweetalert2/dist/sweetalert2.min.css" />
  </head>

  <body>
    <nav class="navbar" style="background-color: rgb(255, 238, 168);">
      <div class="container-fluid">
        <a class="navbar-brand" href="../pages/menuPrincipal.html">
          <img
            src="../public/icons/home-icon.svg"
            alt="Logo"
            width="60"
            height="24"
            class="d-inline-block align-text-top"
          />
        </a>
        <h6><strong>Paquetes</strong></h6>
      </div>
    </nav>

    <br />

    <div class="container">
      <div class="row">
        <div class="col-6">
          <div class="row">
            <div class="col-4">
              <!-- Button trigger modal -->
              <button type="button" class="btn btn botones" data-bs-toggle="modal" data-bs-target="#nuevoProducto">
                <img class="agregar" src="../public/icons/crearPaquete.png" alt="" />
                <h6 class="text"><strong>Nuevo Paquete</strong></h6>
              </button>

              <!-- Modal -->
              <div
                class="modal fade"
                id="nuevoProducto"
                data-bs-backdrop="static"
                data-bs-keyboard="false"
                tabindex="-1"
                aria-labelledby="staticBackdropLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h1 class="modal-title fs-5" id="staticBackdropLabel">
                        Nuevo Paquete
                      </h1>
                      <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                        onclick="limpiarInputsYSelects()"></button>
                    </div>
                    <div class="modal-body">
                      <div class="input-group flex-nowrap">
                        <span class="input-group-text">Código de Paquete</span>
                        <input
                          type="text"
                          id="crearCodigoPaquete"
                          class="form-control"
                          aria-label=""
                          aria-describedby="addon-wrapping"
                          required
                          />
                      </div>
                      <br />
                      <div class="input-group flex-nowrap">
                        <span class="input-group-text">Nombre Paquete</span>
                        <input
                          type="text"
                          id="crearNombrePaquete"
                          class="form-control"
                          aria-label=""
                          aria-describedby="addon-wrapping"
                          required/>
                      </div>
                      <br />
                      <div class="input-group flex-nowrap">
                        <span class="input-group-text">Precio Venta</span>
                        <input
                          type="number"
                          id="crearPrecioPaquete"
                          min="0"
                          class="form-control"
                          placeholder="El precio se actualiza cuando se agregan productos"
                          aria-label=""
                          aria-describedby="addon-wrapping"
                          value="0"
                          disabled
                        />
                      </div>
                      <br>
                      <div class="input-group flex-nowrap">
                        <span class="input-group-text">Descripción</span>
                        <textarea
                          id="crearDescripcionPaquete"
                          class="form-control"
                          placeholder=""
                          aria-label=""
                          aria-describedby="addon-wrapping"
                          rows="3"
                          cols="40"
                          required
                        ></textarea>
                      </div>                      
                    </div>
                    <div class="modal-footer">
                      <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                        onclick="limpiarInputsYSelects()"
                      >
                        Cerrar
                      </button>
                      <button
                        type="button"
                        class="btn btn-success"
                        onclick="nuevoPaquete()"
                      >
                        Crear
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-4">
              <!-- Button trigger modal -->
              <button
                type="button"
                class="btn btn botones"
                data-bs-toggle="modal"
                data-bs-target="#actualizarProducto"
              >
                <img
                  class="agregar"
                  src="../public/icons/agregarPaquete.png"
                  alt=""
                />
                <h6 class="text"><strong>Añadir Productos a un paquete</strong></h6>
              </button>

              <!-- Modal -->
              <div
                class="modal fade"
                id="actualizarProducto"
                data-bs-backdrop="static"
                data-bs-keyboard="false"
                tabindex="-1"
                aria-labelledby="staticBackdropLabel"
                aria-hidden="true"
              >
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h1 class="modal-title fs-5" id="staticBackdropLabel">
                        Añadir Productos
                      </h1>
                      <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                        onclick="limpiarInputsYSelects()"
                      ></button>
                    </div>
                    <div class="modal-body">
                      <div class="input-group flex-nowrap">
                        <span class="input-group-text" for="anadirPaquete"
                          >Paquete</span
                        >
                        <select
                          onload="añadirPaquete();"
                          id="anadirPaquete"
                          class="form-select form-select-sm"
                          aria-label=".form-select-sm example"
                          
                        >
                          <option selected value=""></option>
                        </select>
                      </div>
                      <br />
                      <div class="input-group flex-nowrap">
                        <span class="input-group-text" for="anadirCodigo"
                          >Producto</span
                        >
                        <select
                          onload="añadirCodigo();"
                          id="anadirCodigo"
                          class="form-select form-select-sm"
                          aria-label=".form-select-sm example"
                          required
                        >
                          <option selected value=""></option>
                        </select>
                      </div>
                      <br />
                      <div class="input-group flex-nowrap">
                        <span
                          class="input-group-text"
                          for="añadirPrecioPromocion"
                          >Precio Promocion</span
                        >
                        <input
                          type="number"
                          id="añadirPrecioPromocion"
                          min="0"
                          class="form-control"
                          placeholder="$"
                          aria-label="Codigo"
                          aria-describedby="addon-wrapping"
                          disabled
                        />
                      </div>
                      <br />
                      <div class="input-group flex-nowrap">
                        <span
                          class="input-group-text"
                          for="añadirCantidad"
                          >Cantidad</span
                        >
                        <input
                          type="number"
                          id="añadirCantidad"
                          min="1"
                          class="form-control"
                          placeholder=""
                          aria-label="Codigo"
                          aria-describedby="addon-wrapping"
                          value="1"
                          required
                        />
                      </div>
                    </div>
                    <div class="modal-footer">
                      <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                        onclick="limpiarInputsYSelects();"
                      >
                        Cerrar
                      </button>
                      <button
                        type="button"
                        class="btn btn-success"
                        onclick="añadirProductos();"
                      >
                        Guardar
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-4">
              <!-- Button trigger modal -->
              <button
                type="button"
                class="btn btn botones"
                data-bs-toggle="modal"
                data-bs-target="#eliminarProducto"
              >
                <img
                  class="agregar"
                  src="../public/icons/eliminarPaquete.png"
                  alt=""
                />
                <h6 class="text"><strong>Eliminar Paquete</strong></h6>
              </button>

              <!-- Modal -->
              <div
                class="modal fade"
                id="eliminarProducto"
                data-bs-backdrop="static"
                data-bs-keyboard="false"
                tabindex="-1"
                aria-labelledby="staticBackdropLabel"
                aria-hidden="true"
              >
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h1 class="modal-title fs-5" id="staticBackdropLabel">
                        Eliminar Paquete
                      </h1>
                      <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                        onclick="limpiarInputsYSelects()"
                      ></button>
                    </div>
                    <div class="modal-body">
                      <div class="input-group flex-nowrap">
                        <span class="input-group-text" for="eliminarPaquete"
                          >Paquete</span
                        >
                        <select
                          onload="nombrePaquete()"
                          id="eliminarPaquete"
                          class="form-select form-select-sm"
                          aria-label=".form-select-sm example"
                          
                        >
                          <option selected value=""></option>
                        </select>
                      </div>
                    </div>
                    <div class="modal-footer">
                      <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                        onclick="limpiarInputsYSelects();"
                      >
                        Cerrar
                      </button>
                      <button
                        type="button"
                        class="btn btn-danger"
                        onclick="eliminarPaquete();"
                      >
                        Eliminar
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead>
                <tr class="table titulosDeTabla">
                  <th class="titulo" scope="col">Codigo Paquete</th>
                  <th class="titulo" scope="col">Nombre Paquete</th>
                  <th class="titulo" scope="col">Precio Venta</th>
                  <th class="titulo" scope="col">Productos en Paquete</th>
                  <th class="titulo" scope="col">Descripción del Paquete</th>
                </tr>
              </thead>
              <tbody id="tablaPaquetes"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <template id="templatePaquetes">
      <tr class="paquete">
        <th scope="row"></th>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
    </template>
  </body>
  <script src="../node_modules/jquery/dist/jquery.min.js"></script>
  <script src="../node_modules/popper.js/dist/umd/popper.min.js"></script>
  <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  <script src="../js/paquete.js"></script>
</html>
