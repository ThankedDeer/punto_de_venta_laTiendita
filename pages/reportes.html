<!DOCTYPE html>
<html>
  <head>
    <title>Punto de Venta</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/reporte.css" />
    <script src="../node_modules/axios/dist/axios.min.js"></script>
    <script src="../node_modules/sweetalert2/dist/sweetalert2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.3.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="../node_modules/sweetalert2/dist/sweetalert2.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <nav class="navbar" style="background-color: rgb(255, 238, 168);">
      <div class="container-fluid">
        <a class="navbar-brand" href="../pages/menuPrincipal.html">
          <img
            src="../public/icons/home-icon.svg"
            alt="Logo"
            width="60"
            height="24"
            class="d-inline-block align-text-top"
          />
        </a>
        <h6><strong>Reportes</strong></h6>
      </div>
    </nav>
    <br />

    <div id="contenido">
      <h2 id="Nom_Sucursal"></h2>
      <p>Número de ventas del día <strong id="numVentas"></strong></p>
      <p><strong>Tipos de movimientos en caja</strong></p>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr class="table-dark titulosDeTabla">
              <th class="titulo" scope="col">Tipo de operación</th>
              <th class="titulo" scope="col">Cantidad</th>
            </tr>
          </thead>
          <tbody id="tablaOperacion"></tbody>
        </table>
      </div>
      <p><strong>Productos con menos cantidad en stock</strong></p>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr class="table-dark titulosDeTabla">
              <th class="titulo" scope="col">Nom_Producto</th>
              <th class="titulo" scope="col">Stock</th>
              <th class="titulo" scope="col"></th>
            </tr>
          </thead>
          <tbody id="tablaStock"></tbody>
        </table>
      </div>
      <p><strong>Producto más vendido</strong></p>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr class="table-dark titulosDeTabla">
              <th class="titulo" scope="col">Nom_Producto</th>
              <th class="titulo" scope="col">Vendido</th>
            </tr>
          </thead>
          <tbody id="tablaMas"></tbody>
        </table>
      </div>
      <p><strong>Producto menos vendido</strong></p>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr class="table-dark titulosDeTabla">
              <th class="titulo" scope="col">Nom_Producto</th>
              <th class="titulo" scope="col">Vendido</th>
            </tr>
          </thead>
          <tbody id="tablaMenos"></tbody>
        </table>
      </div>
    </div>

    <button onclick="generarPDF(); window.print()">Genera PDF</button>
    <template id="templateVentass">
      <tr class="producto">
        <th scope="row"></th>
        <td></td>
      </tr>
    </template>
    <template id="templateOperacion">
      <tr class="producto">
        <th scope="row"></th>
        <td></td>
      </tr>
    </template>
    <template id="templateStock">
      <tr class="producto">
        <th scope="row"></th>
        <td></td>
        <td></td>
      </tr>
    </template>
    <template id="templateMas">
      <tr class="producto">
        <th scope="row"></th>
        <td></td>
      </tr>
    </template>
    <template id="templateMenos">
      <tr class="producto">
        <th scope="row"></th>
        <td></td>
      </tr>
    </template>
    <script src="../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../node_modules/popper.js/dist/umd/popper.min.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="../js/reportes.js"></script>
    <script>
      var sucursal = localStorage.getItem("Nom_Sucursal");
            var textoCompleto = sucursal;
            document.getElementById("Nom_Sucursal").textContent = textoCompleto;
    </script>
  </body>
</html>
