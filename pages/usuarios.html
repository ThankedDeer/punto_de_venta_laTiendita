<!DOCTYPE html>
<html>
  <head>
    <title>La Tiendita</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <link rel="stylesheet" href="../css/usuarios.css">
  <script src="../js/usuarios.js"></script>
  
  
  <body>
  
    <nav class="navbar" style="background-color: #0099DD;">
        <div class="container-fluid">
            
          <a class="navbar-brand" href="../pages/menuPrincipal.html">
            <img src="../public/icons/homeIcon.svg" alt="Logo" width="60" height="24" class="d-inline-block align-text-top"> 
        </a>
            <h6> Bienvenido <strong>Eduardo</strong></h5>
              <button class="noselect"><span class="text">Cerrar Sesión</span><span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M24 20.188l-8.315-8.209 8.2-8.282-3.697-3.697-8.212 8.318-8.31-8.203-3.666 3.666 8.321 8.24-8.206 8.313 3.666 3.666 8.237-8.318 8.285 8.203z"></path></svg></span></button>
            </div>
      </nav>
      <div class="container" id="usuarios-container">
        <!-- Las tarjetas de usuario se generan aquí dinámicamente -->
        <div class="row" id="items"></div>
      </div>

      <template id="template-card">
        <div class="card">
          <img src="../imagenes/usuario.png" alt="" class="card-img-top">
          <div class="card-body">
            <h1>Nombre</h1>
          </div>
        </div>
      </template>

      <button  type="button" class="btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal" data-bs-whatever="@getbootstrap"></button>
      
      <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="exampleModalLabel">Agregar nuevo usuario</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form>
                <div class="mb-3">
                  <label for="recipient-name" class="col-form-label">Nombre:</label>
                  <input type="text" class="form-control" id="recipientname" required>
                </div>
                <div class="mb-3">
                  <label for="recipient-name" class="col-form-label">Contraseña:</label>
                  <input type="text" class="form-control" id="recipientname2" required>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button onclick="mostrarAlerta()" type="button" class="btn-sendmessage">Agregar usuario</button>
            </div>
          </div>
        </div>
      </div>
    </body>
    </html>

    <!-- Your app content here -->
    <script src="../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../node_modules/popper.js/dist/umd/popper.min.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    
</body>
</html>
