<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punto de Venta</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  <link rel="stylesheet" href="../css/inventario.css" />
  <script src="../node_modules/axios/dist/axios.min.js"></script>
  <script src="../node_modules/sweetalert2/dist/sweetalert2.min.js"></script>
  <link rel="stylesheet" href="../node_modules/sweetalert2/dist/sweetalert2.min.css"/>
  </head>
  <script src="../js/usuarios.js"></script>
  <body>
    <nav class="navbar" style="background-color: rgb(255, 238, 168);">
      <div class="container-fluid">
        <a class="navbar-brand" href="../pages/menuPrincipal.html">
          <img
            src="../public/icons/home-icon.svg"
            alt="Logo"
            width="60"
            height="24"
            class="d-inline-block align-text-top"
          />
        </a>
        <h6><strong>Usuarios</strong></h6>
      </div>
    </nav>
    <br>
      <div class="container" id="usuarios-container">
        <!-- Las tarjetas de usuario se generan aquí dinámicamente -->
        <div class="row" id="items"></div>
      </div>

      <template id="template-card">
        <div class="col-12 mb-2 col-md-4">
          <div class="card">
            <div class="card-body">
              <img src="../imagenes/usuarios.png">
              <h5>Nombre</h5>
              <button  type="button" class="botonPermisos" data-bs-toggle="modal" data-bs-target="#exampleModal2" data-bs-whatever="@getbootstrap">Cambiar Rol</button><br><br>
              <button class="botonEliminar">Eliminar Usuario</button>
            </div>
          </div>
        </div>
      </template>
          <!--Modal----------------------------------------------------->
      <button  type="button" class="btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal" data-bs-whatever="@getbootstrap"></button>
      
      <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="exampleModalLabel">Agregar nuevo usuario</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form>
                <div class="mb-3">
                  <label for="recipient-name" class="col-form-label">Nombre:</label>
                  <input type="text" class="form-control" id="recipientname" required>
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                    onclick="limpiarInputsYSelects();"
                  >
                    Cerrar
                  </button>
                  <button
                    onclick="eliminarUsario()"
                    type="button"
                    class="btn btn-danger"
                  >
                    Eliminar Usuario
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

      <!--Modal 2 ------------------------------------------------------------------>
      
      <div class="modal fade" id="exampleModal2" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="exampleModalLabel">Cambiar Rol</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div id="checkbox" class="modal-body">
              
                <div id="check" class="mb-3" style="display: flexbox;">
                  <label for="recipient-name" class="col-form-label">Admin:</label>
                  <input type="checkbox" id="checkbox" name="checkbox">
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                    onclick="limpiarInputsYSelects();"
                  >
                    Cerrar
                  </button>
                  <button
                    onclick="updateUsuarios()"
                    type="button"
                    class="btn btn-success"
                  >
                    Actualizar Usuario
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

    <!-- Your app content here -->
    <script src="../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../node_modules/popper.js/dist/umd/popper.min.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  </body>
</html>
