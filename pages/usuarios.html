<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punto de Venta</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  <link rel="stylesheet" href="../css/inventario.css" />
  <script src="../node_modules/axios/dist/axios.min.js"></script>
  <script src="../node_modules/sweetalert2/dist/sweetalert2.min.js"></script>
  <link rel="stylesheet" href="../node_modules/sweetalert2/dist/sweetalert2.min.css"/>
  </head>
  <script src="../js/usuarios.js"></script>
  <body>
    <nav class="navbar" style="background-color: rgb(255, 238, 168);">
      <div class="container-fluid">
        <a class="navbar-brand" href="../pages/menuPrincipal.html">
          <img
            src="../public/icons/home-icon.svg"
            alt="Logo"
            width="60"
            height="24"
            class="d-inline-block align-text-top"
          />
        </a>
        <h6><strong>Usuarios</strong></h6>
      </div>
    </nav>

    <div class="container">
      <div class="row">
        <div class="col-6">
          <div class="row">
            <div class="col-4">          
          <!-- Boton de Crear -->
          <button type="button" class="btn btn botones" data-bs-toggle="modal" data-bs-target="#crear">
          <img class="agregar" src="../public/icons/nuevoCliente.png" alt="">
            <h6 class="text"><strong>Crear Usuario</strong></h6>
          </button>

          <!-- Modal de Crear -->
          <div
          class="modal fade"
          id="crear"
          data-bs-backdrop="static"
          data-bs-keyboard="false"
          tabindex="-1"
          aria-labelledby="staticBackdropLabel"
          aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="staticBackdropLabel">
                    Nuevo Usuario
                  </h1>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                    onclick="limpiarInputsYSelects()"></button>
                </div>
                <div class="modal-body">
                  <div class="input-group flex-nowrap">
                    <span class="input-group-text">Usuario</span>
                    <input
                      type="text"
                      class="form-control"
                      id="usuario"
                      aria-describedby="basic-addon3"
                    />
                  </div>
                  <br>
                  <div class="input-group flex-nowrap">
                    <span class="input-group-text">Contraseña</span>
                    <input
                      type="password"
                      class="form-control"
                      id="contraseña"
                      aria-describedby="basic-addon3"
                    />
                  </div>
                  <br>
                  <div class="input-group flex-nowrap">
                    <span class="input-group-text">Rol</span>
                    <select
                      id="rol"
                      class="form-select"
                      aria-label="Default select example"
                    >
                      <option selected>
                        Selecciona un Rol para el usuario
                      </option>
                      <option value="1">Admin</option>
                      <option value="2">Vendedor</option>
                    </select>
                  </div>
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                    onclick="limpiarInputsYSelects();"
                  >
                    Cerrar
                  </button>
                  <button
                    onclick="postUsuarios()"
                    type="button"
                    class="btn btn-success"
                  >
                    Crear Usuario
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        

        <div class="col-4">
          <!-- Boton de Eliminar -->
          <button
            onclick="selectUsuarios()"
            type="button"
            class="btn btn botones"
            data-bs-toggle="modal"
            data-bs-target="#eliminar"
          >
          <img 
          class="agregar" 
          src="../public/icons/eliminarProducto.png" 
          alt=""
          />
            <h6 class="text"><strong>Eliminar Usuario</strong></h6>
          </button>

          <!-- Modal de Eliminar -->
          <div
            class="modal fade"
            id="eliminar"
            data-bs-backdrop="static"
            data-bs-keyboard="false"
            tabindex="-1"
            aria-labelledby="exampleModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="exampleModalLabel">
                    Eliminar Usuario
                  </h1>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                    onclick="limpiarInputsYSelects();"
                  ></button>
                </div>
                <div class="modal-body">
                  
                  <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon3"
                      >Usuario</span
                    >
                    <select
                      class="form-select"
                      aria-label="Default select example"
                    ></select>
                  </div>
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                    onclick="limpiarInputsYSelects();"
                  >
                    Cerrar
                  </button>
                  <button
                    onclick="eliminarUsario()"
                    type="button"
                    class="btn btn-danger"
                  >
                    Eliminar Usuario
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-4">
          <!-- Boton de actualizar -->
          <button
            onclick="selectUsuarios2()"
            type="button"
            class="btn btn botones"
            data-bs-toggle="modal"
            data-bs-target="#actualizar"
          >
          <img class="agregar" src="../public/icons/actualizarProducto.png" alt="">
            <h6 class="text"><strong>Actualizar Usuario</strong></h6>
          </button>

          <!-- Modal de actualizar -->
          <div
            class="modal fade"
            id="actualizar"
            tabindex="-1"
            aria-labelledby="exampleModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="exampleModalLabel">
                    Actualizar Usuario
                  </h1>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                    onclick="limpiarInputsYSelects();"
                  ></button>
                </div>
                <div class="modal-body">
                  <label for="basic-url" class="form-label"
                    >Selecciona el usuario que desas actualizar</label
                  >
                  <div class="input-group mb-3">
                    <span class="input-group-text" id="updateUsuario"
                      >Usuario</span
                    >
                    <select
                      onchange="updateshow()"
                      id="usuarioSelect"
                      class="form-select"
                      aria-label="Default select example"
                    ></select>
                  </div>

                  <div class="input-group mb-3">
                    <span class="input-group-text">Rol</span>
                    <select
                      id="updateRol"
                      class="form-select"
                      aria-label="Default select example"
                    >
                      <option selected>
                        Selecciona un Rol para el usuario
                      </option>
                      <option value="1">Admin</option>
                      <option value="2">Vendedor</option>
                    </select>
                  </div>
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                    onclick="limpiarInputsYSelects();"
                  >
                    Cerrar
                  </button>
                  <button
                    onclick="updateUsuarios()"
                    type="button"
                    class="btn btn-success"
                  >
                    Actualizar Usuario
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

    <!-- Your app content here -->
    <script src="../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../node_modules/popper.js/dist/umd/popper.min.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  </body>
</html>
