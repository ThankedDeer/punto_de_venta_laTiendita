<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de Venta</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/ventas.css">
  <script src="../node_modules/axios/dist/axios.min.js"></script>
  <script src="../node_modules/sweetalert2/dist/sweetalert2.min.js"></script>
  <link rel="stylesheet" href="../node_modules/sweetalert2/dist/sweetalert2.min.css" />
</head>

<body>
  <nav class="navbar" style="background-color: rgb(255, 238, 168);">
    <div class="container-fluid">

      <a class="navbar-brand" href="../pages/menuPrincipal.html">
        <img src="../public/icons/home-icon.svg" alt="Logo" width="60" height="24" class="d-inline-block align-text-top">
      </a>
      <h5 id="numero"><strong></strong></h5>
      <script>
        var numero = localStorage.getItem("idCaja");
        var textoCompleto = "Caja: " + numero;
        document.getElementById("numero").textContent = textoCompleto;
      </script>
      <h5 id="vendedor"></h5>
      <script>
        var vendedor = localStorage.getItem('vendedor');
        var vendedorObjeto = JSON.parse(vendedor);
        var username = vendedorObjeto.username;
        document.getElementById("vendedor").textContent = "Lo atiende: " + username;
      </script>
      <h6><strong>Ventas</strong></h6>

    </div>
  </nav>
  <br>



  <div class="container">
    <div class="row">

      
      <div class="col-sm-12	col-md-12	col-lg-10	col-xl-10 col-xxl-10">
        <div class="input-group mb-3">
        
          <input id="buscarProducto" onchange="buscarProducto();" type="text" class="form-control"
            placeholder="Ingrese el código del producto">

        </div>

        <br>
        <table class="table">
          <thead>
            <tr>
              <th class="thtabla" scope="col"># Codigo</th>
              <th class="thtabla" scope="col">Producto</th>
              <th class="thtabla" scope="col">Cantidad</th>
              <th class="thtabla" scope="col">Acción</th>
              <th class="thtabla" scope="col">Precio Unitario</th>
              <th class="thtabla" scope="col">Total</th>
            </tr>
          </thead>
          <tbody id="items"></tbody>
          <tfoot>
            <tr id="footer">
              <th scope="row" colspan="5">Lista vacía - escanea para agregar!</th>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="col-sm-12	col-md-12	col-lg-2	col-xl-2	col-xxl-2">
        <button onclick="crearVenta()" id="btnPrint" type="button" class="btn btn-success btn-lg">Subtotal (F1)</button>




        <div class="col-4">       
        <button type="button" class="btn btn-secondary btn-lg" data-bs-toggle="modal" data-bs-target="#crear">
          Consultar Producto
        </button>

          <!-- Modal de Crear -->
          <div
          class="modal fade"
          id="crear"
          data-bs-backdrop="static"
          data-bs-keyboard="false"
          tabindex="-1"
          aria-labelledby="staticBackdropLabel"
          aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="staticBackdropLabel">
                    Consultar Producto
                  </h1>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                    onclick=""></button>
                </div>
                <div class="modal-body">
                  <div class="input-group flex-nowrap">
                    <input
                      type="text"
                      class="form-control"
                      id="filtrarProducto"
                      aria-describedby="basic-addon3"
                      oninput="filtrarProductos()"
                    />
                  </div>
                  <select id="opcionesFiltradas" class="form-control2" onchange=""></select> <!-- Select para mostrar las opciones -->
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                    onclick=""
                  >
                    Cerrar
                  </button>
                  <button
                    onclick="insertarProducto()"
                    type="button"
                    class="btn btn-success"
                  >
                    Insertar
                  </button>
                </div>
              </div>
            </div>
          </div>
      </div>




      <!-- Modal -->
      <div class="modal fade" id="modalBascula" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="productoNombre"></h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">

              <div class="row">
                <label class="label" id="precio"></label>
                <div class="col-6">
                  <form id="formModal">
                    <div class="input-group">
                      <label class="label">Cantidad del producto</label>
                      <input min="0" max="" autocomplete="off" id="cantidad" class="input" type="number">
                    </div>
                  </form>
                </div>
                <div class="col-6">
                  <div class="input-group">

                    <label class="label">Total</label>
                    <input readonly autocomplete="off" value="0" id="importe" class="input" type="number">
                  </div>
                </div>

              </div>


              <div class="modal-footer">
                <button onclick="limpiarModal()" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" id="aceptar" class="btn btn-success">Aceptar</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <template id="templateLista">
      <tr id="trTabla">
        <th scope="row">id</th>
        <td>Café</td>
        <td>1</td>
        <td>
          <button class="btn btn-info btn-sm">
            +
          </button>
          <button class="btn btn-danger btn-sm">
            -
          </button>
        </td>
        <td>$ <span>500</span></td>
        <td>$ <span>500</span></td>
      </tr>
    </template>


    <template id="template-footer">
      <th class="footersize" scope="row" colspan="2">Total productos</th>
      <td class="footersize">10</td>
      <td class="footersize">
        <button class="btn btn-danger btn-sm" id="vaciar-carrito">
          vaciar todo
        </button>
      </td>
      <td class="font-weight-bold footersize"> <span></span></td>
      <td class="font-weight-bold footersize">$ <span id="total">5000</span></td>
    </template>


</body>
<script src="../node_modules/jquery/dist/jquery.min.js"></script>
<script src="../node_modules/popper.js/dist/umd/popper.min.js"></script>
<script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
<script src="../js/scrypt.js"></script>
<script>

</script>

</html>
