<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  

</head>

<body>
  <nav class="navbar" style="background-color: #0099DD;">
    <div class="container-fluid">

      <a class="navbar-brand" href="../pages/menuPrincipal.html">
        <img src="../public/icons/homeIcon.svg" alt="Logo" width="60" height="24" class="d-inline-block align-text-top">
      </a>
      <h6> Bienvenido a <strong>La Tiendita</strong></h5>
  
    </div>
  </nav>
  <br>
  <div class="row">
    <div class="col-3"></div>
    <div class="col-6">
      <div class="input-group mb-3">
        <input id="buscarProducto" type="text" class="form-control" placeholder="Ingrese el codigo de producto">
        <button onclick="buscarProducto()" type="button" class="btn btn-dark">Agregar</button>
      </div>
      <br>
      <h4>Lista de articulos</h4>
      <table class="table">
        <thead>
          <tr>
            <th scope="col"># Codigo</th>
            <th scope="col">Nombre</th>
            <th scope="col">Cantidad</th>
            <th scope="col">Acción</th>
            <th scope="col">Precio Unitario</th>
            <th scope="col">Total</th>
          </tr>
        </thead>
        <tbody id="items"></tbody>
        <tfoot>
          <tr id="footer">
            <th scope="row" colspan="5">Lista vacía - escanea para agregar!</th>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="col-3"></div>
  </div>
  </div>
  </div>


  <template id="templateLista">
    <tr>
      <th scope="row">id</th>
      <td>Café</td>
      <td>1</td>
      <td>
          <button class="btn btn-info btn-sm">
              +
          </button>
          <button class="btn btn-danger btn-sm">
              -
          </button>
      </td>
      <td>$ <span>500</span></td>
      <td>$ <span>500</span></td>
    </tr>
  </template>


  <template id="template-footer">
    <th scope="row" colspan="2">Total productos</th>
    <td>10</td>
    <td>
        <button class="btn btn-danger btn-sm" id="vaciar-carrito">
            vaciar todo
        </button>
    </td>
    <td class="font-weight-bold"> <span></span></td>
    <td class="font-weight-bold">$ <span>5000</span></td>
</template>


</body>
<script src="../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../node_modules/popper.js/dist/umd/popper.min.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="../js/scrypt.js"></script>

</html>
